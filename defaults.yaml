metadata:
  title: "Reasons for Persons: An Obsolescence Solution to The Good Successor Problem"
  author: "Kanad Chakrabarti"
  date: "February 2026"
  papersize: letter
  fontsize: 11pt
  documentclass: report
  linestretch: 1.5
  link-citations: true
  colorlinks: true
