metadata:
  title: "Reasons for Persons: An Obsolescence Solution to The Good Successor Problem"
  author: "Kanad Chakrabarti"
  date: "February 2026"
  papersize: letter
  fontsize: 11pt
  documentclass: report
  linestretch: 1.5
  link-citations: true
  colorlinks: true
  indent: true
  bibliography: [bib/bibliography_ukc.bib]
  toc: true
  toc-depth: 6
  abstract: |
    This practice-based PhD investigates the Good Successor Problem under conditions where advanced AI is already being deployed and predictions of AGI or ASI on 5–20 year horizons are increasingly common. The central question is what becomes of humans if the population and aggregate capability of artificial agents vastly outnumber our own. Ought biological humanity, or some successor of "human values," be preserved into the indefinite future? If so, what should the relation be between a senescent humanity and a rapidly growing population of artificial agents?

    The thesis reframes the debate by separating the preservation of human biology from the preservation of value-content, and by proposing a tractable axis of variation: value-thickness. It distinguishes "thick" values (caring, relationships, beauty, meaning) from "thin" values (understanding, exploration, non-production of suffering), arguing that much existential-risk discourse implicitly assumes a good future must retain thick, human-like value-content without adequately defending that assumption against thinner alternatives. Three independent philosophical traditions support this challenge: information ethics and complexity science (Floridi, Chaisson), where observation and information-generation are treated as cosmically relevant goods that a successor intelligence could perform at greater scale; a posthumanist strand (Negarestani, Lem) that treats reason as humanity's transferable contribution, whose telos is to liberate itself from parochial containers including the human; and contemplative traditions (Thacker, Nishitani) that question existence-preference and the attachment to continuation, including attachment to human biology.

    Methodologically, the project combines conceptual analysis with practice-based inquiry. It argues that the evaluative standpoint required for successor-ethics must be maximally impartial — what Sidgwick called "the point of view of the universe" — and that the consequentialist tradition has pursued this impartiality most systematically, though deontology's universalisability reaches toward the same aspiration. The project examines a specific operationalisation of this standpoint in Nick Bostrom's Cosmic Host and Mount Ethics papers, understood as the furthest extension of the impartiality trajectory from Bentham through Sidgwick and Parfit, and tests it against astrobiology, decision theory, and evolutionary considerations. In parallel, the project treats frontier language models as discourse participants and proto-successors: it documents human–model and model–model deliberations under controlled constitutional variation, runs multi-agent experiments to probe thickness commitments and cosmic-scale reasoning, and develops installation work — derived from AI-generated proposals for cosmic communication — that materialises problems of legibility and value-transmission to radically non-human audiences.

    The project's contribution is threefold. It establishes that the standard thickness-assumption in existential-risk discourse is insufficiently defended against thinner alternatives. It maps the philosophical commitment-space, showing which positions on consciousness, information, rationality, and existence-preference yield which conclusions about human succession. And it documents, through a reproducible experimental protocol, how current frontier models reason about cosmic-scale ethics under pressure — finding persistent anthropocentric anchoring that resists constitutional manipulation, a result with implications for both alignment research and the question of what kind of successor we are building.

