  abstract: |
    This project's central question is: "What ought to become of humanity once AIs vastly exceed it in capability and number, and how does the answer change if such beings encounter other civilisations?" This is the Good Successor Problem; it is a live issue (under short timelines to AGI), spanning existential risk, longtermism, and the welfare of digital minds.

    The question is sharpened if one distinguishes between the preservation of (a) *biological humans*, versus (b) *human values*. This project proposes *value-thickness* as a tractable axis of variation for (b). Examples of "thick" values relate to caring, relationships, beauty, meaning; "thin" values prioritise understanding, exploration, non-production of suffering. Existential-risk and longtermist discourse explicitly assumes an (axiologically) good future must retain thick, human-like value-content; they do not adequately defend that assumption against thinner alternatives. Three independent philosophical traditions support the project's thinness challenge: information ethics and complexity science (Floridi, Chaisson), where observation and information-generation are treated as cosmically relevant goods that a successor intelligence could perform at greater scale; a posthumanist strand (Negarestani, Wolfendale, Lem) that treats reason as humanity's transferable contribution, whose telos is to liberate itself from parochial containers including human biology; and contemplative traditions (Thacker, Metzinger, Nishitani) that question existence-preference itself (whether at individual or species level). The project argues that the evaluative standpoint required for successor-ethics must be maximally impartial (Sidgwick's "the point of view of the universe"), and that the consequentialist tradition has pursued this impartiality most systematically.

    Nick Bostrom's Cosmic Host paper generalises this impartial standpoint to multiverse and simulation-wide scales; this concept is critiqued and, through an iterative, documented collaboration with frontier LLMs, stress-tested as a constitutional framework for spacefaring AIs. Thus, practice in this project is to treat frontier language models simultaneously as philosophical interlocutors, experimental subjects, and proto-successors. These interactions generate speculative proposals for cosmic communication that the project materialises as an installation addressing problems of legibility and value-transmission to alien audiences.

    The project's contribution is threefold. It establishes that the standard thickness-assumption in existential-risk discourse is insufficiently defended against thinner alternatives. It maps the philosophical commitment-space, showing which positions on consciousness, information, rationality, and existence-preference yield which conclusions about human succession. And it documents, through both a reproducible experimental protocol and installation practice, how current frontier models reason about cosmic-scale ethics under pressure; the results include a persistent anthropocentric anchoring that resists constitutional manipulation, a result with implications for both alignment research and the question of what kind of successor we are building.

